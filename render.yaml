services:
  - type: static_site
    name: haritnavinya-frontend
    plan: free
    staticPublishPath: frontend/build
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    autoDeployOnPush: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: https://haritnavinya.onrender.com
      - key: VITE_SOCKET_URL
        value: https://haritnavinya.onrender.com
  
  - type: web_service
    name: haritnavinya-backend
    plan: free
    runtime: node
    buildCommand: cd backend && npm install --legacy-peer-deps
    startCommand: cd backend && npm start
    autoDeployOnPush: true
    healthCheckPath: /api/health
    healthCheckInterval: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "5000"
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        fromDatabase:
          name: haritnavinya-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://haritnavinya.netlify.app,https://haritnavinya.onrender.com,https://haritnavinya-backend.onrender.com,https://haritnavinya-frontend.onrender.com"
      - key: LOG_LEVEL
        value: info
      - key: OPENWEATHER_API_KEY
        value: f6c3bb91052b9f8d79aefcc5c7efabbf
      - key: GEMINI_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        sync: false
      - key: DISASTER_PORT
        value: "4000"

databases:
  - name: haritnavinya-db
    plan: free
    version: "4.4"
