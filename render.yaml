services:
  - type: static_site
    name: haritnavinya-frontend
    plan: free
    staticPublishPath: frontend/build
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    autoDeployOnPush: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: https://haritnavinya.onrender.com
      - key: VITE_SOCKET_URL
        value: https://haritnavinya.onrender.com
  
  - type: web_service
    name: haritnavinya-backend
    plan: free
    runtime: node
    buildCommand: cd backend && npm install --legacy-peer-deps
    startCommand: cd backend && npm start
    autoDeployOnPush: true
    healthCheckPath: /api/health
    healthCheckInterval: 30
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "5000"
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        fromDatabase:
          name: haritnavinya-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://haritnavinya-frontend.onrender.com,https://haritnavinya.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: LOG_LEVEL
        value: info
      - key: GEMINI_API_KEY
        sync: false
      - key: AGMARKNET_API_KEY
        value: "579b464db66ec23bdd0000017954c766c08b48836cca314f2ac28314"
      - key: API_KEY
        value: "579b464db66ec23bdd0000017954c766c08b48836cca314f2ac28314"
      - key: DISASTER_PORT
        value: "4000"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false

databases:
  - name: haritnavinya-db
    plan: free
    version: "4.4"
